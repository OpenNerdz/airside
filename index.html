<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Airside</title>
<meta name="description" content="Live flight status and airport departure boards. Fast, clean and free of ads.">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1015" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.flightradar24.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <a class="brand" href="./" data-nav aria-label="Airside home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="var(--sign)"/><g fill="var(--sign-ink)"><path transform="translate(4 1.5) rotate(60 12 12)" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/><rect x="6" y="25" width="20" height="2.2" rx="1.1"/></g></svg>
      Airside
    </a>
    <form class="search search-top js-flight-search" id="top-search" role="search" hidden>
      <label class="sr-only" for="q-top">Flight number</label>
      <input id="q-top" name="q" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search" placeholder="Flight number">
      <button aria-label="Track flight"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </form>
  </div>
</header>
<main id="view" class="wrap"></main>
<footer class="wrap foot">
  <p>All times are local to each airport. Live data comes from Flightradar24 and can lag behind airport screens, so check with your airline before you travel.</p>
</footer>
</body>
</html>
